# Build + test on every push/PR, natively on both release architectures.
#
# This is the fast correctness gate: host toolchain (clang/libstdc++ on
# the runner), unit tests (gitmanip GTest + core indexer), and the wire
# conformance suite against the freshly built agent. The portable
# (debian:11 / glibc 2.31 floor) release binaries are built by
# release.yml with the docker/ image instead.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      # The runner images (ubuntu-24.04 and its arm64 partner image)
      # ship Clang, CMake, Python 3, git, pipx and a Rust toolchain, so
      # nothing here needs apt. Conan comes from PyPI.
      - name: Install toolchain
        run: |
          pipx install "conan>=2,<3"
          conan --version && cmake --version && clang --version | head -1

      # The unit tests exercise real behavior, so the runner needs a
      # real environment: gitmanip's rebase/tag/commit-builder paths use
      # libgit2's git_signature_default (reads user.name/user.email from
      # git config), and the core indexer tests drive actual language
      # servers over LSP (clangd for C++, pylsp for Python,
      # rust-analyzer for Rust).
      # clangd and Emacs have no non-apt source on both architectures,
      # so this is the one apt transaction. It runs without the Azure
      # mirror (first in the image's mirror list; its DNS failed every
      # run on 2026-11-11), with retries and a transfer timeout so a
      # mirror that stops answering fails the step instead of spinning
      # for the rest of the job's life. pylsp comes from PyPI,
      # rust-analyzer from the image's rustup.
      - name: Provision test environment
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          APT="sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $APT update
          $APT install -y --no-install-recommends clangd emacs-nox python3-venv
          pipx install python-lsp-server
          rustup component add rust-analyzer || true
          command -v clangd && command -v pylsp && command -v rust-analyzer

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.arch }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: conan-${{ matrix.arch }}-

      - name: Conan install
        run: |
          conan profile detect --force
          conan install . --output-folder=build --build=missing \
            -s build_type=Release -s compiler.cppstd=23

      - name: Configure and build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          cmake --build build -j"$(nproc)"

      - name: Unit tests (gitmanip + core)
        run: ctest --test-dir build --output-on-failure

      - name: Wire conformance suite
        run: |
          VER="$(sed -n 's/^project(scrutiny-agent VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$VER"
          python3 tests/conformance/conformance.py \
            build/agent/scrutiny-agent --agent-version "$VER"

      # The behavioral suite: framing, handshake, chunking,
      # cancellation, lanes, the fs sandbox, the credential broker, and
      # every git/lsp/index/watch/diffcache surface, against hermetic
      # fixtures. run-tests.sh provisions its own venv (including pylsp,
      # so the LSP paths assert rather than skip).
      - name: Python test suite
        run: tests/run-tests.sh -q

      # Emacs client: byte-compile as a lint, then the ERT suite. The
      # integration test does the REAL bootstrap over a local `sh`
      # transport against the binary built above (base64 streaming,
      # sha256 gate, exec, handshake, chunk reassembly, and a raw-LSP
      # tunnel round trip against pylsp).
      - name: Emacs client (byte-compile + ERT)
        run: |
          emacs --version | head -1
          emacs -Q --batch -L emacs -f batch-byte-compile \
            emacs/scrutiny-agent.el emacs/scrutiny-agent-eglot.el
          rm -f emacs/*.elc
          SCRUTINY_AGENT_BIN="$PWD/build/agent/scrutiny-agent" \
            emacs -Q --batch -L emacs -l emacs/scrutiny-agent-tests.el \
            -f ert-run-tests-batch-and-exit

      # The ops/UI/verify layers, driven against a real agent over a
      # local `sh' transport. The verify harness asserts that every
      # capability meta.hello advertises is exercised from the Emacs
      # side too, so a protocol addition cannot land unverified.
      # Five linters, because each catches something the others miss.
      # package-lint is the one that matters most here: it compares what
      # the code uses against the Emacs version the package claims, and
      # caught `defvar-keymap' (29.1) in a file declaring 28.1 -- a
      # package that installs and then fails to load.
      #
      # --elsa adds static type inference, compared against
      # emacs/.elsa-baseline: a file whose count goes UP fails. The
      # count is not zero because part of the residue is Elsa's own
      # blind spots (cl-defstruct accessors, callbacks, defcustom
      # defaults); the baseline is what makes the delta legible anyway.
      # It costs a few minutes, which is why it is one step and not
      # part of every developer's inner loop.
      - name: Lint the Emacs Lisp
        run: scripts/lint-elisp.sh --elsa

      # magit routing: which invocations get sent over git.exec, how
      # output is placed, and -- with magit installed -- that magit's
      # own readers return the same answers over the agent as they do
      # from a subprocess.
      - name: Emacs magit routing suite
        run: |
          emacs -Q --batch --eval "(progn \
            (require 'package) \
            (add-to-list 'package-archives \
                         '(\"melpa\" . \"https://melpa.org/packages/\")) \
            (package-initialize) (package-refresh-contents) \
            (package-install 'magit))" || \
            echo "magit unavailable; the magit-API test will skip"
          PATH="$PWD/tests/.venv/bin:$PATH" \
          SCRUTINY_AGENT_BIN="$PWD/build/agent/scrutiny-agent" \
            emacs -Q --batch -L emacs \
            --eval "(progn (require 'package) (package-initialize))" \
            -l emacs/scrutiny-agent-magit-tests.el \
            -f ert-run-tests-batch-and-exit

      # The file-name handler: fidelity of every read and write, plus
      # the ordering property that decides whether it is reached at all
      # (a handler registered behind TRAMP's is inert).
      - name: Emacs file handler suite
        run: |
          PATH="$PWD/tests/.venv/bin:$PATH" \
          SCRUTINY_AGENT_BIN="$PWD/build/agent/scrutiny-agent" \
            emacs -Q --batch -L emacs \
            -l emacs/scrutiny-agent-fs-tests.el \
            -f ert-run-tests-batch-and-exit

      - name: Emacs ops/UI suite
        run: |
          emacs -Q --batch -L emacs -f batch-byte-compile \
            emacs/scrutiny-agent-ops.el emacs/scrutiny-agent-ui.el \
            emacs/scrutiny-agent-verify.el emacs/scrutiny-agent-xref.el \
            emacs/scrutiny-agent-fs.el emacs/scrutiny-agent-remote.el
          bash -n scripts/build-agents.sh
          rm -f emacs/*.elc
          PATH="$PWD/tests/.venv/bin:$PATH" \
          SCRUTINY_AGENT_BIN="$PWD/build/agent/scrutiny-agent" \
            emacs -Q --batch -L emacs -l emacs/scrutiny-agent-ui-tests.el \
            -f ert-run-tests-batch-and-exit
