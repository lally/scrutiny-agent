# Tag-labeled releases: pushing a tag `v<version>` builds the portable
# Linux binaries (debian:11 image -> glibc 2.31 floor, static C++
# runtime) natively on each architecture's runner, proves each binary
# over the wire with the conformance suite (built on debian:11, run on
# the newer-glibc runner -- which also proves portability), and
# publishes a GitHub Release carrying:
#
#   * the binaries + .sha256 sidecars, named exactly as the Scrutiny
#     bootstrap expects (scrutiny-agent-<version>-<arch>), and
#   * scrutiny-agent-<version>.tar -- the Emacs package, with both
#     binaries bundled inside it.
#
# Those are the two ways this gets used. Someone driving the Scrutiny
# Mac app wants the raw binaries to bundle into the app; someone using
# Emacs wants one file they can `package-install-file' and have work,
# including on the first connect, without a second download.
#
# workflow_dispatch re-runs the release for a tag that already exists
# (`gh workflow run release.yml -f tag=v0.2.3`): the source is checked
# out at that tag while the workflow file comes from the branch the run
# was dispatched on, so a fix to this file can be applied to an existing
# tag without moving the tag or spending another version number. The
# release is created if missing, or its assets replaced if it exists.
# Dispatched with an empty tag it builds 0.0.0-test from the dispatched
# branch and uploads workflow artifacts only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.3; empty = test build only"
        default: ""

# The tag being released: the pushed tag, or the dispatched one.
# Empty for a tagless dispatch (test build, no release job).
env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            case "$RELEASE_TAG" in
              v[0-9]*) ;;
              *) echo "tag '$RELEASE_TAG' is not of the form v<version>" >&2; exit 1 ;;
            esac
            git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null \
              || git fetch --depth 1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")" \
              || { echo "checkout is not at $RELEASE_TAG" >&2; exit 1; }
            V="${RELEASE_TAG#v}"
          else
            V="0.0.0-test"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building agent version $V for ${{ matrix.arch }} (tag: ${RELEASE_TAG:-none})"

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build portable ${{ matrix.arch }} agent (debian:11 image)
        env:
          AGENT_VERSION: ${{ steps.ver.outputs.version }}
          PLATFORMS: ${{ matrix.platform }}
        run: bash docker/build-agent.sh

      # The conformance suite's raw-LSP round trip talks to whichever
      # language server the host has. The runner image ships rustup,
      # whose rust-analyzer is a proxy that exits with an error until
      # the component is installed (the suite copes, but then nothing
      # real is exercised), so provision the same servers ci.yml uses.
      - name: Provision language servers
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          sudo apt-get install -y --no-install-recommends clangd python3-pylsp
          if command -v rustup >/dev/null 2>&1; then
            rustup component add rust-analyzer || true
          fi
          command -v clangd && command -v pylsp

      # First-class release gate: the binary built inside the debian:11
      # (glibc 2.31) image must run on this newer-glibc runner and pass
      # the full wire conformance suite, including the version check
      # against the tag and the .sha256 sidecar hash-gate.
      - name: Wire conformance against the release binary
        env:
          AGENT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BIN="docker/dist/scrutiny-agent-${AGENT_VERSION}-${{ matrix.arch }}"
          test -x "$BIN"
          git --version && python3 --version
          python3 tests/conformance/conformance.py "$BIN" \
            --agent-version "$AGENT_VERSION"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: scrutiny-agent-${{ matrix.arch }}
          path: docker/dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The Emacs package carries both architectures, so it can only be
      # assembled here, after both build jobs have landed their
      # artifacts.
      - name: Build the Emacs package
        run: |
          V="${RELEASE_TAG#v}"
          bash scripts/package-emacs.sh --binaries dist --version "$V" \
            --out dist

      # Prove the package actually installs and finds its binaries
      # before publishing it. A release that installs but cannot
      # connect is worse than no release. The runner image has no
      # Emacs (the v0.2.3 release job died here with "emacs: command
      # not found"); emacs-nox is what ci.yml installs too.
      - name: Install Emacs
        run: sudo apt-get install -y --no-install-recommends emacs-nox

      - name: Verify the package installs
        run: |
          V="${RELEASE_TAG#v}"
          PKGDIR="$(mktemp -d)"
          emacs -Q --batch --eval "
            (progn
              (require 'package)
              (setq package-user-dir \"$PKGDIR\")
              (package-initialize)
              (package-install-file \"dist/scrutiny-agent-$V.tar\")
              (require 'scrutiny-agent-remote)
              (unless (equal scrutiny-agent-binary-version \"$V\")
                (error \"package reports version %s, expected $V\"
                       scrutiny-agent-binary-version))
              (let ((found (mapcar #'car (scrutiny-agent-installed-binaries))))
                (dolist (arch '(\"x86_64\" \"aarch64\"))
                  (unless (member arch found)
                    (error \"package ships no %s binary (found %S)\"
                           arch found)))
                (princ (format \"package %s installs; binaries: %S\n\"
                               \"$V\" found))))"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${RELEASE_TAG#v}"
          ls -l dist

          # Quoted heredoc: the backticks below are markdown, and an
          # unquoted one would run them as command substitution. The
          # version is substituted afterwards.
          cat > /tmp/notes.md <<'NOTES'
          ## Two ways to use this

          ### Emacs

              M-x package-install-file RET scrutiny-agent-__V__.tar RET

          Both Linux agent binaries (x86_64 and aarch64) are inside the
          package, so the first connect to a server needs no further
          download: the client probes the remote with `uname`, picks the
          matching binary, streams it over your existing ssh/tsh
          transport, verifies it runs there, and starts talking to it.

          Four lines of configuration are in the package's `INSTALL.md`.

          ### Scrutiny

          `scrutiny-agent-__V__-x86_64` and `scrutiny-agent-__V__-aarch64`,
          each with a `.sha256` sidecar, named exactly as the bootstrap
          expects. Built on debian:11 (glibc 2.31 floor, static C++
          runtime), so they run on any still-supported distro.

          ---
          NOTES
          sed -i "s/__V__/$V/g" /tmp/notes.md

          # --generate-notes appends the auto-generated changelog after
          # the notes file, so both are kept. A dispatched re-run for a
          # tag whose release already exists replaces the assets
          # instead of failing on the duplicate.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG exists; replacing its assets"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "scrutiny-agent $RELEASE_TAG" \
              --notes-file /tmp/notes.md \
              --generate-notes
          fi
